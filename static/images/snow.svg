<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="snowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6e3f4" />
      <stop offset="100%" stop-color="#a6d1e3" />
    </linearGradient>
  </defs>
  
  <g fill="none" stroke="url(#snowGradient)" stroke-width="2" stroke-linecap="round">
    <!-- 中心六边形 -->
    <circle cx="50" cy="50" r="5" fill="#a6d1e3" />
    
    <!-- 主要雪花分支 -->
    <g>
      <!-- 水平分支 -->
      <path d="M35 50 L65 50" />
      <path d="M35 50 L30 45" stroke-width="1.5" />
      <path d="M35 50 L30 55" stroke-width="1.5" />
      <path d="M65 50 L70 45" stroke-width="1.5" />
      <path d="M65 50 L70 55" stroke-width="1.5" />
      
      <!-- 60度角分支 -->
      <path d="M42.5 35 L57.5 65" />
      <path d="M42.5 35 L38 32" stroke-width="1.5" />
      <path d="M42.5 35 L40 30" stroke-width="1.5" />
      <path d="M57.5 65 L62 68" stroke-width="1.5" />
      <path d="M57.5 65 L60 70" stroke-width="1.5" />
      
      <!-- 120度角分支 -->
      <path d="M57.5 35 L42.5 65" />
      <path d="M57.5 35 L62 32" stroke-width="1.5" />
      <path d="M57.5 35 L60 30" stroke-width="1.5" />
      <path d="M42.5 65 L38 68" stroke-width="1.5" />
      <path d="M42.5 65 L40 70" stroke-width="1.5" />
    </g>
    
    <!-- 次要雪花分支 -->
    <g stroke-width="1.2">
      <!-- 垂直分支 -->
      <path d="M50 35 L50 65" />
      <path d="M50 35 L47 32" stroke-width="1" />
      <path d="M50 35 L53 32" stroke-width="1" />
      <path d="M50 65 L47 68" stroke-width="1" />
      <path d="M50 65 L53 68" stroke-width="1" />
      
      <!-- 30度角分支 -->
      <path d="M60 40 L40 60" />
      <path d="M60 40 L62 38" stroke-width="1" />
      <path d="M60 40 L63 42" stroke-width="1" />
      <path d="M40 60 L38 62" stroke-width="1" />
      <path d="M40 60 L37 58" stroke-width="1" />
      
      <!-- 150度角分支 -->
      <path d="M40 40 L60 60" />
      <path d="M40 40 L38 38" stroke-width="1" />
      <path d="M40 40 L37 42" stroke-width="1" />
      <path d="M60 60 L62 62" stroke-width="1" />
      <path d="M60 60 L63 58" stroke-width="1" />
    </g>
  </g>
</svg>